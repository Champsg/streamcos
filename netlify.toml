[build]
  publish = "frontend"

[[redirects]]
  from = "/api/*"
  to = "https://some-linked-acne-straight.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://some-linked-acne-straight.trycloudflare.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
