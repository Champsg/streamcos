[build]
  publish = "frontend"

# Generated by scripts/set-api-base.js - do not hand-edit the target URLs.
# Re-run `npm run config:url -- <backend-url>` (or restart start.js) whenever
# the tunnel hostname changes.
[[redirects]]
  from = "/api/*"
  to = "https://streamcos-play.loca.lt/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://streamcos-play.loca.lt/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
